name: Experimental native MI-GAN Rust
on:
  push:
    branches: ["experiment/ai-migan-cpu"]
    paths:
      - "crates/ml/**"
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/photocraft/Cargo.toml"
      - "apps/photocraft-cli/Cargo.toml"
      - ".github/workflows/ai-migan-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust model-independent logic
        run: cargo test -p photocraft-ml --lib
      - name: Compile optional ONNX backend
        run: cargo check -p photocraft-ml --features onnx
      - name: Compile native engine command
        run: cargo check -p photocraft-engine --features local-ai-migan
      - name: Test native engine command
        run: cargo test -p photocraft-engine --features local-ai-migan ai_migan_cmds::tests
      - name: Check crate dependency layers
        run: cargo xtask layers
