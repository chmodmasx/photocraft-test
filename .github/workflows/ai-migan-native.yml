name: Experimental native MI-GAN Rust
on:
  push:
    branches: ["experiment/ai-migan-cpu"]
    paths:
      - "crates/ml/**"
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/photocraft/Cargo.toml"
      - "apps/photocraft-cli/Cargo.toml"
      - ".github/workflows/ai-migan-native.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust model-independent logic
        run: cargo test -p photocraft-ml --lib
      - name: Compile optional ONNX backend
        run: cargo check -p photocraft-ml --features onnx
      - name: Compile native engine command
        run: cargo check -p photocraft-engine --features local-ai-migan
      - name: Test native engine command
        run: cargo test -p photocraft-engine --features local-ai-migan ai_migan_cmds::tests
      - name: Download the pinned model for real native inference
        run: python3 experiments/migan/download_model.py --download
      - name: End-to-end PhotoCraft command (CPU model, layer, mask, undo and redo)
        run: |
          export PHOTOCRAFT_MIGAN_MODEL="$PWD/experiments/migan/models/migan_pipeline_v2.onnx"
          cargo test -p photocraft-engine --features local-ai-migan real_cpu_inference_creates_layer_and_undoes -- --ignored --nocapture
      - name: Check crate dependency layers
        run: cargo xtask layers
      - name: Apply rustfmt and persist resolved Cargo.lock
        run: |
          cargo fmt --all
          git add Cargo.lock crates/ml/src/lib.rs crates/ml/src/native.rs crates/engine/src/ai_migan_cmds.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(ai): format Rust files and lock native dependencies'
            git push origin HEAD:refs/heads/experiment/ai-migan-cpu
          fi

